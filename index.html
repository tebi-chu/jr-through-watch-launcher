<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#173e48">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>JR直通ウォッチ</title>

  <style>
    :root{font:16px system-ui,-apple-system,sans-serif;color:#173e48;background:#f2f6f6}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,480px);background:#fff;border:1px solid #d4e1e2;border-radius:20px;padding:32px;text-align:center;box-shadow:0 10px 32px #173e4814}
    img{width:96px;height:96px;border-radius:22px}h1{font-size:26px;margin:18px 0 8px}p{line-height:1.7}
    a.button{display:block;background:#147d7a;color:#fff;border-radius:10px;padding:16px;margin:24px 0;text-decoration:none;font-weight:700}
    small{display:block;color:#607d82;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <img src="./apple-touch-icon.png" alt="電車を正面から見たアイコン" width="96" height="96">

    <a class="button" href="https://script.google.com/macros/s/AKfycbwTxBQUpyYyPJplla-nAnvdGQ7rzYeRHlwigFJWqJJA-kJHtbBt9VBk3J5CtYredMKS/exec">本人限定アプリを開く</a>

  </main>
</body>
</html>
